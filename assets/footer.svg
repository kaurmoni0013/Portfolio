<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.05)" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.05)" />
    </linearGradient>

    <filter id="foot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', 'SF Mono', Consolas, monospace; }

    @keyframes pulse-signal {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    @keyframes heartbeat {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-dot {
      animation: pulse-signal 2s infinite ease-in-out;
    }

    .pulse-line {
      stroke-dasharray: 40 120;
      animation: heartbeat 4s linear infinite;
    }
  </style>

  <!-- Container -->
  <rect width="900" height="70" rx="8" fill="url(#foot-bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Subtle Heartbeat Signal Line -->
  <path d="M 40 35 L 280 35 L 290 22 L 300 48 L 310 28 L 320 38 L 330 35 L 570 35 L 580 24 L 590 46 L 600 35 L 860 35" 
        fill="none" stroke="#1e293b" stroke-width="1.2" />
  <path d="M 40 35 L 280 35 L 290 22 L 300 48 L 310 28 L 320 38 L 330 35 L 570 35 L 580 24 L 590 46 L 600 35 L 860 35" 
        fill="none" stroke="#22d3ee" stroke-width="1.5" class="pulse-line" filter="url(#foot-glow)" />

  <!-- Central Motto Overlay -->
  <rect x="335" y="16" width="230" height="38" rx="6" fill="#0b1320" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
  
  <circle cx="355" cy="35" r="3" fill="#22d3ee" class="pulse-dot" />
  <text x="368" y="39" fill="#f8fafc" class="font-mono" font-size="10" font-weight="700" letter-spacing="1.2">ALWAYS BUILDING</text>
  <text x="475" y="39" fill="#64748b" class="font-mono" font-size="10">•</text>
  <text x="490" y="39" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1.2">LEARNING</text>
</svg>
