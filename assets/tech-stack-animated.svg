<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b121d" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a29" />
      <stop offset="100%" stop-color="#0a121d" />
    </linearGradient>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="matrix-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }

    @keyframes pulse-cyan {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    @keyframes float-card {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .pulse-led { animation: pulse-cyan 2.4s infinite ease-in-out; }
    .floating-1 { animation: float-card 4s infinite ease-in-out; }
    .floating-2 { animation: float-card 4.5s infinite ease-in-out 0.6s; }
    .floating-3 { animation: float-card 4.2s infinite ease-in-out 1.2s; }
  </style>

  <!-- Base Container -->
  <rect width="900" height="360" rx="12" fill="url(#tech-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="900" height="360" rx="12" fill="url(#matrix-grid)" />

  <!-- Header Bar -->
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e293b" stroke-width="1" />
  <circle cx="25" cy="19" r="3.5" fill="#22d3ee" class="pulse-led" />
  <text x="38" y="23" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">TECHNOLOGIES, RUNTIMES &amp; SYSTEM STACK</text>
  <text x="875" y="23" text-anchor="end" fill="#64748b" class="font-mono" font-size="10">PRODUCTION ENVIRONMENT</text>

  <!-- ================= ROW 1 (TOP) ================= -->

  <!-- CARD 1: LANGUAGES -->
  <g transform="translate(25, 52)" class="floating-1">
    <rect width="265" height="88" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="265" height="20" rx="8" fill="#132338" />
    <text x="12" y="14" fill="#38bdf8" class="font-mono" font-size="9" font-weight="700">01 // LANGUAGES</text>
    
    <!-- Pills -->
    <g transform="translate(10, 32)">
      <!-- C++ -->
      <rect x="0" y="0" width="48" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="24" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">C++</text>
      <!-- Java -->
      <rect x="54" y="0" width="52" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="80" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Java</text>
      <!-- JavaScript -->
      <rect x="112" y="0" width="82" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="153" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">JavaScript</text>
      <!-- SQL -->
      <rect x="200" y="0" width="45" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="222.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">SQL</text>
    </g>
  </g>

  <!-- CARD 2: BACKEND CORE -->
  <g transform="translate(305, 52)" class="floating-2">
    <rect width="285" height="88" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="285" height="20" rx="8" fill="#132338" />
    <text x="12" y="14" fill="#38bdf8" class="font-mono" font-size="9" font-weight="700">02 // BACKEND CORE</text>
    
    <!-- Pills -->
    <g transform="translate(10, 30)">
      <!-- Node.js -->
      <rect x="0" y="0" width="65" height="20" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8" />
      <text x="32.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Node.js</text>
      <!-- Express.js -->
      <rect x="71" y="0" width="78" height="20" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />
      <text x="110" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Express.js</text>
      <!-- REST APIs -->
      <rect x="155" y="0" width="76" height="20" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
      <text x="193" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">REST APIs</text>
      <!-- JWT -->
      <rect x="237" y="0" width="38" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="256" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">JWT</text>
      
      <!-- Zod -->
      <rect x="0" y="26" width="48" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="24" y="40" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Zod</text>
      <!-- Rate Limiting -->
      <rect x="54" y="26" width="105" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="106.5" y="40" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9">Rate Limiting</text>
      <!-- Server RBAC -->
      <rect x="165" y="26" width="100" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="215" y="40" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9">Server RBAC</text>
    </g>
  </g>

  <!-- CARD 3: DATABASES -->
  <g transform="translate(605, 52)" class="floating-3">
    <rect width="270" height="88" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="270" height="20" rx="8" fill="#132338" />
    <text x="12" y="14" fill="#38bdf8" class="font-mono" font-size="9" font-weight="700">03 // DATABASES &amp; CACHE</text>
    
    <!-- Pills -->
    <g transform="translate(10, 32)">
      <!-- MongoDB -->
      <rect x="0" y="0" width="75" height="20" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8" />
      <text x="37.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">MongoDB</text>
      <!-- MySQL -->
      <rect x="81" y="0" width="60" height="20" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
      <text x="111" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">MySQL</text>
      <!-- Redis -->
      <rect x="147" y="0" width="58" height="20" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
      <text x="176" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Redis</text>
      <!-- ACID -->
      <rect x="211" y="0" width="45" height="20" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
      <text x="233.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">ACID</text>
    </g>
  </g>

  <!-- ================= ROW 2 (MIDDLE) ================= -->

  <!-- CARD 4: DEVOPS & CI/CD -->
  <g transform="translate(25, 150)" class="floating-2">
    <rect width="415" height="96" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="415" height="20" rx="8" fill="#132338" />
    <text x="12" y="14" fill="#38bdf8" class="font-mono" font-size="9" font-weight="700">04 // DEVOPS &amp; INFRASTRUCTURE</text>
    
    <!-- Pills -->
    <g transform="translate(12, 30)">
      <!-- Linux -->
      <rect x="0" y="0" width="55" height="20" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="0.8" />
      <text x="27.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Linux</text>
      <!-- Git -->
      <rect x="61" y="0" width="42" height="20" rx="4" fill="#431407" stroke="#f97316" stroke-width="0.8" />
      <text x="82" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Git</text>
      <!-- GitHub -->
      <rect x="109" y="0" width="64" height="20" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />
      <text x="141" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">GitHub</text>
      <!-- Docker -->
      <rect x="179" y="0" width="62" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="210" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Docker</text>
      <!-- GitHub Actions -->
      <rect x="247" y="0" width="112" height="20" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
      <text x="303" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">GitHub Actions</text>
      
      <!-- Jenkins -->
      <rect x="0" y="26" width="64" height="20" rx="4" fill="#1c1917" stroke="#ea580c" stroke-width="0.8" />
      <text x="32" y="40" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Jenkins</text>
      <!-- CI/CD Pipelines -->
      <rect x="70" y="26" width="115" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="127.5" y="40" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9">CI/CD Pipelines</text>
    </g>
  </g>

  <!-- CARD 5: FRONTEND -->
  <g transform="translate(455, 150)" class="floating-3">
    <rect width="420" height="96" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="420" height="20" rx="8" fill="#132338" />
    <text x="12" y="14" fill="#38bdf8" class="font-mono" font-size="9" font-weight="700">05 // FRONTEND &amp; UI</text>
    
    <!-- Pills -->
    <g transform="translate(12, 30)">
      <!-- React -->
      <rect x="0" y="0" width="55" height="20" rx="4" fill="#082f49" stroke="#00f2fe" stroke-width="0.8" />
      <text x="27.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">React</text>
      <!-- HTML -->
      <rect x="61" y="0" width="50" height="20" rx="4" fill="#431407" stroke="#f97316" stroke-width="0.8" />
      <text x="86" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">HTML</text>
      <!-- CSS -->
      <rect x="117" y="0" width="45" height="20" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
      <text x="139.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">CSS</text>
      <!-- Vite -->
      <rect x="168" y="0" width="48" height="20" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="0.8" />
      <text x="192" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Vite</text>
      <!-- Tailwind CSS -->
      <rect x="222" y="0" width="94" height="20" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="0.8" />
      <text x="269" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Tailwind CSS</text>

      <!-- SPAs & State Management -->
      <rect x="0" y="26" width="180" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="90" y="40" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9">SPAs &amp; State Machines</text>
    </g>
  </g>

  <!-- ================= ROW 3 (BOTTOM) ================= -->

  <!-- CARD 6: BACKEND & SYSTEM DESIGN + AI -->
  <g transform="translate(25, 256)" class="floating-1">
    <rect width="850" height="88" rx="8" fill="url(#card-grad)" stroke="#0ea5e9" stroke-width="1.2" />
    <rect x="0" y="0" width="850" height="20" rx="8" fill="#082b3d" />
    <text x="12" y="14" fill="#22d3ee" class="font-mono" font-size="9" font-weight="700">06 // BACKEND &amp; SYSTEM DESIGN + AI APIS</text>
    
    <!-- Pills -->
    <g transform="translate(12, 30)">
      <!-- DSA -->
      <rect x="0" y="0" width="45" height="20" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="0.8" />
      <text x="22.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">DSA</text>
      <!-- OOP -->
      <rect x="51" y="0" width="45" height="20" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="0.8" />
      <text x="73.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">OOP</text>
      <!-- Caching -->
      <rect x="102" y="0" width="64" height="20" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="0.8" />
      <text x="134" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Caching</text>
      <!-- Bloom Filters -->
      <rect x="172" y="0" width="96" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="220" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Bloom Filters</text>
      <!-- Consistent Hashing -->
      <rect x="274" y="0" width="134" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="341" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Consistent Hashing</text>
      <!-- Kafka -->
      <rect x="414" y="0" width="55" height="20" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
      <text x="441.5" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Kafka</text>
      
      <!-- OpenRouter -->
      <rect x="475" y="0" width="90" height="20" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="520" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">OpenRouter</text>
      <!-- Gemini API -->
      <rect x="571" y="0" width="86" height="20" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="614" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">Gemini API</text>
      <!-- SSE -->
      <rect x="663" y="0" width="46" height="20" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="686" y="14" text-anchor="middle" fill="#f8fafc" class="font-mono" font-size="9.5" font-weight="600">SSE</text>
    </g>
  </g>
</svg>
